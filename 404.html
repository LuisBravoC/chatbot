<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada</title>
    <script>
        // Guardar la ruta solicitada
        sessionStorage.redirect = location.pathname + location.search;
        
        // Redirigir a index.html
        location.href = "/chatbot/";
    </script>
</head>
<body>
    <!-- Fallback en caso de que JavaScript esté deshabilitado -->
    <p>Redirigiendo a la página principal...</p>
    <a href="/chatbot/">Haz clic aquí si no se redirige automáticamente</a>
</body>
</html>
